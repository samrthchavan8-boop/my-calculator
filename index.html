<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Calculator with Dark Mode</title>
    <!-- Link the web app manifest for PWABuilder -->
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #f4f4f9;
            --calc-bg: #ffffff;
            --display-bg: #222;
            --display-text: #fff;
            --btn-bg: #e0e0e0;
            --btn-text: #000;
            --btn-hover: #d4d4d4;
        }

        body.dark-mode {
            --bg-color: #121212;
            --calc-bg: #1e1e1e;
            --display-bg: #000;
            --display-text: #0f0;
            --btn-bg: #2d2d2d;
            --btn-text: #fff;
            --btn-hover: #3d3d3d;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.3s;
        }

        .theme-toggle {
            margin-bottom: 15px;
            padding: 8px 15px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #333;
            color: #fff;
            font-size: 14px;
        }

        .calculator {
            background: var(--calc-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 260px;
            transition: background 0.3s;
        }

        #display {
            width: 100%;
            height: 45px;
            background: var(--display-bg);
            color: var(--display-text);
            font-size: 22px;
            text-align: right;
            padding: 5px 10px;
            box-sizing: border-box;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: var(--btn-bg);
            color: var(--btn-text);
            transition: background 0.2s;
        }

        button:hover {
            background: var(--btn-hover);
        }

        button.operator {
            background: #ff9500;
            color: white;
        }

        button.operator:hover {
            background: #e08500;
        }

        button.clear {
            background: #ff3b30;
            color: white;
        }

        button.clear:hover {
            background: #d32f2f;
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">Toggle Dark Mode</button>

    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')" class="operator">/</button>
            <button onclick="appendValue('*')" class="operator">*</button>
            <button onclick="appendValue('-')" class="operator">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')" class="operator">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="calculate()" class="operator" style="grid-row: span 2; height: 100%;">=</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            
            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Error';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }
    </script>

</body>
</html>
